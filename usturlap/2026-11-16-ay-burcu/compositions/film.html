lap><span id="hava-sub-in" class="in" data-var-text="havaSub">Bir sohbet, yeni bir fikir</span></div></div><div class="slot"><div id="su-lab" class="clip line lab" data-start="20.40" data-duration="3.20" data-track-index="2" data-layout-allow-overlap><span id="su-lab-in" class="in" data-var-text="suLabel">SU AY · YENGEÇ, AKREP, BALIK</span></div><div id="su-head" class="clip line head" data-start="20.40" data-duration="3.20" data-track-index="3" data-layout-allow-overlap><span id="su-head-in" class="in" data-var-text="suHead">Duyguya alan açmak</span></div><div id="su-sub" class="clip line sub" data-start="20.40" data-duration="3.20" data-track-index="4" data-layout-allow-overlap><span id="su-sub-in" class="in" data-var-text="suSub">Sessizlik, müzik, sevdiğin biri</span></div></div>

      <div id="cta-a" class="clip line hook" data-start="24.50" data-duration="4.50" data-track-index="3" data-layout-allow-overlap style="top:300px"><span id="cta-a-in" class="in" data-var-text="cta1">Senin Ay burcun</span> <span id="cta-b-in" class="in gold" data-var-text="cta2">hangisi?</span></div>
      <div id="cta-c" class="clip line sub" data-start="25.00" data-duration="4.00" data-track-index="3" data-layout-allow-overlap style="top:404px"><span id="cta-c-in" class="in" data-var-text="cta3">Yorumlara yaz</span></div>
      <div id="wordmark" class="clip" data-start="25.50" data-duration="3.50" data-track-index="3"><span class="wl" id="wl0">U</span><span class="wl" id="wl1">S</span><span class="wl" id="wl2">T</span><span class="wl" id="wl3">U</span><span class="wl" id="wl4">R</span><span class="wl" id="wl5">L</span><span class="wl" id="wl6">A</span><span class="wl" id="wl7">P</span></div>
      <div id="handle" class="clip line " data-start="26.30" data-duration="2.70" data-track-index="3" data-layout-allow-overlap><span id="handle-in" class="in" data-var-text="handle">@usturlap.astro</span></div>
    </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const C = "540 890";
      const blurIn = (sel, at, d = 0.18) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, at);
      const blurOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, at);
      const inkIn = (sel, at) => tl.fromTo(sel, { opacity: 0, color: "#8B92A8" }, { opacity: 1, color: "#F2EDE3", duration: 0.3, ease: "power2.out" }, at);

      // ---- hook: frame 0 already reads ----
      tl.set(["#clock-in", "#hook-a-in"], { opacity: 1 }, 0);
      blurIn("#hook-b-in", 0.35);
      blurIn("#hook-c-in", 0.6, 0.22);
      [["#lw2", 1.2], ["#lw7", 1.9], ["#lw4", 2.6]].forEach(([s, t]) => tl.to(s, { attr: { "fill-opacity": 0.08 }, duration: 0.12, ease: "power2.out" }, t));
      blurOut(["#clock-in", "#hook-a-in"], 3.0);
      blurOut(["#hook-b-in", "#hook-c-in"], 3.06);

      // ---- camera push into the moon: one move ----
      tl.fromTo("#world-svg", { scale: 1 }, { scale: 2.7692, transformOrigin: "540px 890px", duration: 3.6, ease: "power3.inOut" }, 1.2);
      tl.to("#moon-cres", { opacity: 0, duration: 0.5, ease: "power2.out" }, 4.3);
      // colour flood: the night sky becomes the room, so the dial lands on the same ground
      tl.to("#sky", { attr: { fill: "#0B0D12" }, duration: 0.7, ease: "power2.inOut" }, 4.1);
      tl.to(["#stars", "#city"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.1);

      // ---- moon ring becomes the dial ----
      tl.fromTo("#d-detail", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.8);
      tl.fromTo(".sign", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 4.9);
      tl.fromTo("#needle", { opacity: 0, rotation: -150, svgOrigin: C }, { opacity: 1, rotation: -150, svgOrigin: C, duration: 0.3 }, 5.0);
      tl.fromTo("#d-pin", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.0);
      tl.set("#trigon", { rotation: 0, svgOrigin: C }, 0);

      blurIn("#lesson-a-in", 5.15, 0.2);
      blurIn("#lesson-b-in", 5.3, 0.2);
      blurOut(["#lesson-a-in", "#lesson-b-in"], 7.55);

      // ---- four elements ----
      const EL = [['ates', [0, 4, 8]], ['toprak', [1, 5, 9]], ['hava', [2, 6, 10]], ['su', [3, 7, 11]]];
      EL.forEach(([key, signs], k) => {
        const t0 = 7.6 + k * 4.0;
        const rot = k * 150;
        tl.to("#needle", { rotation: rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, t0);
        if (k > 0) {
          tl.to("#trigon", { rotation: rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, t0);
          const prev = EL[k - 1][1].map((i) => "#sg" + i);
          tl.to(prev, { attr: { fill: "#8B92A8" }, duration: 0.2, ease: "power2.out" }, t0);
        } else {
          tl.to("#trigon", { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, t0 + 0.8);
        }
        tl.to(signs.map((i) => "#sg" + i), { attr: { fill: "#E8D3A0" }, duration: 0.25, ease: "power2.out" }, t0 + 0.8);
        tl.fromTo("#" + key + "-lab-in", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, t0 + 0.95);
        blurIn("#" + key + "-head-in", t0 + 1.1, 0.2);
        inkIn("#" + key + "-sub-in", t0 + 1.4);
        blurOut(["#" + key + "-lab-in", "#" + key + "-head-in", "#" + key + "-sub-in"], t0 + 3.75);
      });

      // ---- pull back into the emblem ----
      const tEnd = 23.6;
      tl.to(["#d-detail", "#trigon"], { opacity: 0, duration: 0.3, ease: "power2.in" }, tEnd);
      tl.to("#dial-svg", { scale: 0.33, y: -130, transformOrigin: "540px 890px", duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#needle", { rotation: 771, svgOrigin: C, duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#d-cres", { opacity: 1, duration: 0.4, ease: "power2.out" }, tEnd + 0.55);
      blurIn("#cta-a-in", 24.6, 0.2);
      blurIn("#cta-b-in", 24.75, 0.22);
      inkIn("#cta-c-in", 25.1);
      tl.fromTo(".wl", { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, stagger: 0.1, ease: "power2.out" }, 25.6);
      inkIn("#handle-in", 26.4);

      window.__timelines["film"] = tl;
    })();
  </script>
</template>
