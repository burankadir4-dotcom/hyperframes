verlap><span id="hava-sub-in" class="in" data-var-text="havaSub">Bir sohbet, yeni bir fikir</span></div></div><div class="slot"><div id="su-lab" class="clip line lab" data-start="22.40" data-duration="3.60" data-track-index="2" data-layout-allow-overlap><span id="su-lab-in" class="in" data-var-text="suLabel">SU AY · YENGEÇ, AKREP, BALIK</span></div><div id="su-head" class="clip line head" data-start="22.40" data-duration="3.60" data-track-index="3" data-layout-allow-overlap><span id="su-head-in" class="in" data-var-text="suHead">Duyguya alan açmak</span></div><div id="su-sub" class="clip line sub" data-start="22.40" data-duration="3.60" data-track-index="4" data-layout-allow-overlap><span id="su-sub-in" class="in" data-var-text="suSub">Sessizlik, müzik, sevdiğin biri</span></div></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const C = "540 860";
      const blurIn = (sel, at, d = 0.18) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, at);
      const blurOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, at);
      const inkIn = (sel, at) => tl.fromTo(sel, { opacity: 0, color: "#8B92A8" }, { opacity: 1, color: "#F2EDE3", duration: 0.3, ease: "power2.out" }, at);

      // ---- hook: frame 0 already reads; timings follow the voice's words (+0.3 s offset) ----
      tl.set(["#clock-in", "#hook-a-in"], { opacity: 1 }, 0);
      blurIn(["#hook-b-in", "#hook-c-in"], 3.25);
      tl.fromTo("#hook-c-in", { color: "#8B92A8" }, { color: "#E8D3A0", duration: 0.3, ease: "power2.out" }, 4.4);
      [["#lw2", 1.0], ["#lw7", 1.6], ["#lw4", 2.2]].forEach(([s, t]) => tl.to(s, { attr: { "fill-opacity": 0.08 }, duration: 0.12, ease: "power2.out" }, t));
      blurOut(["#clock-in", "#hook-a-in"], 5.1);
      blurOut(["#hook-b-in", "#hook-c-in"], 5.16);

      // ---- camera push into the moon: one move ----
      tl.fromTo("#world-svg", { scale: 1 }, { scale: 2.4615, transformOrigin: "540px 860px", duration: 3.8, ease: "power3.inOut" }, 2.2);
      tl.to("#moon-cres", { opacity: 0, duration: 0.5, ease: "power2.out" }, 5.5);
      tl.to("#sky", { attr: { fill: "#0B0D12" }, duration: 0.7, ease: "power2.inOut" }, 5.3);
      tl.to(["#stars", "#city"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.3);

      // ---- moon ring becomes the dial ----
      tl.fromTo("#d-detail", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5.85);
      tl.fromTo(".sign", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 5.95);
      tl.fromTo("#needle", { opacity: 0, rotation: -150, svgOrigin: C }, { opacity: 1, rotation: -150, svgOrigin: C, duration: 0.3 }, 6.05);
      tl.fromTo("#d-pin", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.05);
      tl.set("#trigon", { rotation: 0, svgOrigin: C }, 0);

      blurIn("#lesson-a-in", 7.0, 0.2);   // "Ay burcunda"
      blurIn("#lesson-b-in", 8.36, 0.2);  // "Çünkü"
      blurOut(["#lesson-a-in", "#lesson-b-in"], 10.95);

      // ---- the needle searches the signs while the voice explains, then lands on Koç on "ateş" ----
      tl.to("#needle", { rotation: 360, svgOrigin: C, duration: 2.48, ease: "power2.inOut" }, 9.2);

      const EL = [['ates', [0, 4, 8]], ['toprak', [1, 5, 9]], ['hava', [2, 6, 10]], ['su', [3, 7, 11]]];
      const STOPS = [11.68, 15.66, 19.42, 22.4];
      const EXITS = [14.85, 18.6, 21.58, 25.75];
      EL.forEach(([key, signs], k) => {
        const stop = STOPS[k];
        if (k > 0) {
          const rot = k * 150;
          tl.to("#needle", { rotation: 360 + rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, stop - 0.8);
          tl.to("#trigon", { rotation: rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, stop - 0.8);
          tl.to(EL[k - 1][1].map((i) => "#sg" + i), { attr: { fill: "#8B92A8" }, duration: 0.2, ease: "power2.out" }, stop - 0.8);
        } else {
          tl.to("#trigon", { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, stop);
        }
        tl.to(signs.map((i) => "#sg" + i), { attr: { fill: "#E8D3A0" }, duration: 0.25, ease: "power2.out" }, stop);
        tl.fromTo("#" + key + "-lab-in", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, stop + 0.08);
        blurIn("#" + key + "-head-in", stop + 0.18, 0.2);
        inkIn("#" + key + "-sub-in", stop + 0.4);
        blurOut(["#" + key + "-lab-in", "#" + key + "-head-in", "#" + key + "-sub-in"], EXITS[k]);
      });

      // ---- pull back into the emblem ----
      const tEnd = 25.8;
      tl.to(["#d-detail", "#trigon"], { opacity: 0, duration: 0.3, ease: "power2.in" }, tEnd);
      tl.to("#dial-svg", { scale: 0.37, y: -130, transformOrigin: "540px 860px", duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#needle", { rotation: 1131, svgOrigin: C, duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#d-cres", { opacity: 1, duration: 0.4, ease: "power2.out" }, tEnd + 0.55);
      blurIn(["#cta-a-in", "#cta-b-in"], 26.0, 0.2);
      tl.fromTo("#cta-b-in", { color: "#8B92A8" }, { color: "#E8D3A0", duration: 0.3, ease: "power2.out" }, 27.28);
      inkIn("#cta-c-in", 28.08);
      tl.fromTo(".wl", { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, stagger: 0.1, ease: "power2.out" }, 28.6);
      inkIn("#handle-in", 29.4);

      window.__timelines["film"] = tl;
    })();
  </script>
