  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const C = "540 810";
      const blurIn = (sel, at, d = 0.18) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, at);
      const blurOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, at);
      const inkIn = (sel, at) => tl.fromTo(sel, { opacity: 0, color: "#8B92A8" }, { opacity: 1, color: "#F2EDE3", duration: 0.3, ease: "power2.out" }, at);

      // ---- hook: frame 0 already reads; timings follow the voice's words (+0.3 s offset) ----
      tl.set(["#clock-in", "#hook-a-in"], { opacity: 1 }, 0);
      blurIn(["#hook-b-in", "#hook-c-in"], 3.25);
      tl.fromTo("#hook-c-in", { color: "#8B92A8" }, { color: "#E8D3A0", duration: 0.3, ease: "power2.out" }, 4.57);
      [["#lw2", 1.0], ["#lw7", 1.6], ["#lw4", 2.2]].forEach(([s, t]) => tl.to(s, { attr: { "fill-opacity": 0.08 }, duration: 0.12, ease: "power2.out" }, t));
      blurOut(["#clock-in", "#hook-a-in"], 4.90);
      blurOut(["#hook-b-in", "#hook-c-in"], 4.96);

      // ---- camera push into the moon: one move ----
      tl.fromTo("#world-svg", { scale: 1 }, { scale: 2.2692, transformOrigin: "540px 810px", duration: 3.8, ease: "power3.inOut" }, 2.00);
      tl.to("#moon-cres", { opacity: 0, duration: 0.5, ease: "power2.out" }, 5.30);
      // the sky stays navy; the night layer takes over from the scaled-up window, and the skyline rises back under the dial
      tl.fromTo("#night-svg", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.inOut" }, 5.10);
      tl.fromTo("#skyline", { y: 520 }, { y: 0, duration: 1.1, ease: "expo.out" }, 5.70);
      tl.fromTo("#d-face", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5.65);
      tl.to(["#stars", "#city"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.10);

      // ---- moon ring becomes the dial ----
      tl.fromTo("#d-detail", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5.65);
      tl.fromTo(".sign", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 5.75);
      tl.fromTo("#needle", { opacity: 0, rotation: -150, svgOrigin: C }, { opacity: 1, rotation: -150, svgOrigin: C, duration: 0.3 }, 5.85);
      tl.fromTo("#d-pin", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.85);
      tl.set("#trigon", { rotation: 0, svgOrigin: C }, 0);

      blurIn("#lesson-a-in", 7.59, 0.2);   // "Ay burcunda"
      blurIn("#lesson-b-in", 9.22, 0.2);  // "Çünkü"
      blurOut(["#lesson-a-in", "#lesson-b-in"], 12.69);

      // ---- the needle searches the signs while the voice explains, then lands on Koç on "ateş" ----
      tl.to("#needle", { rotation: 360, svgOrigin: C, duration: 3.59, ease: "power2.inOut" }, 10.09);

      const EL = [['ates', [0, 4, 8]], ['toprak', [1, 5, 9]], ['hava', [2, 6, 10]], ['su', [3, 7, 11]]];
      const STOPS = [13.68, 17.52, 21.38, 24.34];
      const EXITS = [16.71, 20.57, 23.53, 27.39];
      EL.forEach(([key, signs], k) => {
        const stop = STOPS[k];
        if (k > 0) {
          const rot = k * 150;
          tl.to("#needle", { rotation: 360 + rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, stop - 0.8);
          tl.to("#trigon", { rotation: rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, stop - 0.8);
          tl.to(EL[k - 1][1].map((i) => "#sg" + i), { attr: { fill: "#8B92A8" }, duration: 0.2, ease: "power2.out" }, stop - 0.8);
        } else {
          tl.to("#trigon", { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, stop);
        }
        tl.to(signs.map((i) => "#sg" + i), { attr: { fill: "#E8D3A0" }, duration: 0.25, ease: "power2.out" }, stop);
        tl.to(".ew" + k, { attr: { "fill-opacity": 0.85 }, duration: 0.12, stagger: 0.09, ease: "power2.out" }, stop + 0.05);
        tl.fromTo("#" + key + "-lab-in", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, stop + 0.08);
        blurIn("#" + key + "-head-in", stop + 0.18, 0.2);
        inkIn("#" + key + "-sub-in", stop + 0.4);
        blurOut(["#" + key + "-lab-in", "#" + key + "-head-in", "#" + key + "-sub-in"], EXITS[k]);
      });

      // ---- pull back into the emblem ----
      const tEnd = 27.44;
      tl.to(["#d-detail", "#trigon"], { opacity: 0, duration: 0.3, ease: "power2.in" }, tEnd);
      tl.to("#dial-svg", { scale: 0.4, y: -80, transformOrigin: "540px 810px", duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#needle", { rotation: 1131, svgOrigin: C, duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#d-cres", { opacity: 1, duration: 0.4, ease: "power2.out" }, tEnd + 0.55);
      blurIn(["#cta-a-in", "#cta-b-in"], 27.74, 0.2);
      tl.fromTo("#cta-b-in", { color: "#8B92A8" }, { color: "#E8D3A0", duration: 0.3, ease: "power2.out" }, 29.19);
      inkIn("#cta-c-in", 29.74);
      tl.fromTo(".wl", { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, stagger: 0.1, ease: "power2.out" }, 31.89);
      inkIn("#handle-in", 32.69);

      window.__timelines["film"] = tl;
    })();
  </script>
