<!doctype html>
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #0b0d12;
        --ivory: #f2ede3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--night);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="film"
        data-composition-id="film"
        data-composition-src="compositions/film.html"
        data-start="0"
        data-duration="32"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="32"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Voice: ElevenLabs "Serkan Yılmaz" (eleven_v4), normalised to -16 LUFS. The voice is the clock: every beat starts on its phrase. -->
      <audio id="vo" class="clip" src="assets/vo/vo-serkan.mp3" data-start="0.3" data-duration="28.68" data-track-index="4" data-volume="1"></audio>
      <!-- Effects land one frame after their picture, under the voice. No music bed yet (HeyGen catalog needs sign-in). -->
      <audio id="sfx-push" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="1.63" data-duration="4.3" data-track-index="5" data-volume="0.3" data-fade-out="0.8"></audio>
      <audio id="sfx-tick-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.64" data-duration="0.36" data-track-index="6" data-volume="1.1"></audio>
      <audio id="sfx-tick-2" class="clip" src="assets/sfx/key-press.mp3" data-start="15.62" data-duration="0.43" data-track-index="6" data-volume="2.6"></audio>
      <audio id="sfx-tick-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="19.38" data-duration="0.36" data-track-index="6" data-volume="1.1"></audio>
      <audio id="sfx-tick-4" class="clip" src="assets/sfx/key-press.mp3" data-start="22.36" data-duration="0.43" data-track-index="6" data-volume="2.6"></audio>
      <audio id="sfx-pull" class="clip" src="assets/sfx/whoosh.mp3" data-start="26.07" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="25.16" data-duration="4.3" data-track-index="7" data-volume="0.1" data-fade-in="0.8" data-fade-out="0.8"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
