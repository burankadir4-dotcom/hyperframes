<!doctype html>
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #0b0d12;
        --ivory: #f2ede3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--night);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="film"
        data-composition-id="film"
        data-composition-src="compositions/film.html"
        data-start="0"
        data-duration="29"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Sound: no music bed yet (HeyGen catalog needs sign-in). Effects land one frame after their picture. -->
      <audio id="sfx-push" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0.53" data-duration="4.3" data-track-index="5" data-volume="0.45" data-fade-out="0.8"></audio>
      <audio id="sfx-tick-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.36" data-duration="0.36" data-track-index="6" data-volume="1.4"></audio>
      <audio id="sfx-tick-2" class="clip" src="assets/sfx/key-press.mp3" data-start="12.36" data-duration="0.43" data-track-index="6" data-volume="3.2"></audio>
      <audio id="sfx-tick-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="16.36" data-duration="0.36" data-track-index="6" data-volume="1.4"></audio>
      <audio id="sfx-tick-4" class="clip" src="assets/sfx/key-press.mp3" data-start="20.36" data-duration="0.43" data-track-index="6" data-volume="3.2"></audio>
      <audio id="sfx-pull" class="clip" src="assets/sfx/whoosh.mp3" data-start="23.97" data-duration="0.57" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="22.16" data-duration="4.3" data-track-index="7" data-volume="0.18" data-fade-in="0.5" data-fade-out="0.8"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
