  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const C = "540 810";
      const blurIn = (sel, at, d = 0.18) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, at);
      const blurOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, at);
      const inkIn = (sel, at) => tl.fromTo(sel, { opacity: 0, color: "#8B92A8" }, { opacity: 1, color: "#F2EDE3", duration: 0.3, ease: "power2.out" }, at);

      // ---- hook: frame 0 already reads; the match strikes on "ilk adımı" ----
      tl.set("#hook-a-in", { opacity: 1 }, 0);
      blurIn(["#hook-b-in", "#hook-c-in"], 2.04);
      tl.fromTo("#hook-c-in", { color: "#8B92A8" }, { color: "#E8D3A0", duration: 0.3, ease: "power2.out" }, 2.60);
      const STRIKE = 2.19;
      tl.set("#flame", { scale: 0, svgOrigin: "540 830" }, 0);
      tl.fromTo("#match", { y: 34 }, { y: 0, duration: 0.16, ease: "power4.out" }, STRIKE);
      tl.to("#flame", { scale: 1, svgOrigin: "540 830", duration: 0.4, ease: "expo.out" }, STRIKE + 0.04);
      blurOut("#hook-a-in", 3.30);
      blurOut(["#hook-b-in", "#hook-c-in"], 3.36);

      // ---- the flame stretches into the needle; the dial draws itself around it ----
      tl.to("#flame", { scaleY: 1.9, scaleX: 0.12, svgOrigin: "540 830", duration: 0.5, ease: "power3.in" }, 3.60);
      tl.fromTo("#needle", { opacity: 0, rotation: 0, svgOrigin: C }, { opacity: 1, rotation: 0, svgOrigin: C, duration: 0.12 }, 4.06);
      tl.fromTo("#d-pin", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.06);
      tl.to("#flame", { opacity: 0, duration: 0.12 }, 4.10);
      tl.to("#match", { y: 420, opacity: 0, duration: 0.6, ease: "power2.in" }, 4.06);
      tl.fromTo("#d-face", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.20);
      tl.to("#d-ring", { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 4.20);
      tl.fromTo("#d-detail", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.70);
      tl.fromTo(".sign", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 4.75);
      tl.set("#trigon", { rotation: 0, svgOrigin: C }, 0);

      blurIn("#lesson-a-in", 4.45, 0.2);   // "Mars burcunda"
      blurIn("#lesson-b-in", 5.77, 0.2);  // "Çünkü"
      blurOut(["#lesson-a-in", "#lesson-b-in"], 8.37);

      // ---- the needle makes a full turn while the voice explains, then lands on Koç on "ateş" ----
      tl.to("#needle", { rotation: 360, svgOrigin: C, duration: 2.87, ease: "power2.inOut" }, 6.54);

      const EL = [['ates', [0, 4, 8]], ['toprak', [1, 5, 9]], ['hava', [2, 6, 10]], ['su', [3, 7, 11]]];
      const STOPS = [9.41, 13.54, 17.26, 21.18];
      const EXITS = [12.73, 16.45, 20.37, 25.15];
      EL.forEach(([key, signs], k) => {
        const stop = STOPS[k];
        if (k > 0) {
          const rot = k * 150;
          tl.to("#needle", { rotation: 360 + rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, stop - 0.8);
          tl.to("#trigon", { rotation: rot, svgOrigin: C, duration: 0.8, ease: "power2.inOut" }, stop - 0.8);
          tl.to(EL[k - 1][1].map((i) => "#sg" + i), { attr: { fill: "#8B92A8" }, duration: 0.2, ease: "power2.out" }, stop - 0.8);
        } else {
          tl.to("#trigon", { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, stop);
        }
        tl.to(signs.map((i) => "#sg" + i), { attr: { fill: "#E8D3A0" }, duration: 0.25, ease: "power2.out" }, stop);
        tl.to(".ew" + k, { attr: { "fill-opacity": 0.85 }, duration: 0.12, stagger: 0.09, ease: "power2.out" }, stop + 0.05);
        tl.fromTo("#" + key + "-lab-in", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, stop + 0.08);
        blurIn("#" + key + "-head-in", stop + 0.18, 0.2);
        inkIn("#" + key + "-sub-in", stop + 0.4);
        blurOut(["#" + key + "-lab-in", "#" + key + "-head-in", "#" + key + "-sub-in"], EXITS[k]);
      });

      // ---- pull back into the emblem ----
      const tEnd = 25.2;
      tl.to(["#d-detail", "#trigon"], { opacity: 0, duration: 0.3, ease: "power2.in" }, tEnd);
      tl.to("#dial-svg", { scale: 0.4, y: -80, transformOrigin: "540px 810px", duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#needle", { rotation: 1131, svgOrigin: C, duration: 1.0, ease: "power2.inOut" }, tEnd);
      tl.to("#d-cres", { opacity: 1, duration: 0.4, ease: "power2.out" }, tEnd + 0.55);
      blurIn(["#cta-a-in", "#cta-b-in"], 25.50, 0.2);
      tl.fromTo("#cta-b-in", { color: "#8B92A8" }, { color: "#E8D3A0", duration: 0.3, ease: "power2.out" }, 26.66);
      inkIn("#cta-c-in", 27.26);
      tl.fromTo(".wl", { opacity: 0.3, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, stagger: 0.1, ease: "power2.out" }, 28.37);
      inkIn("#handle-in", 29.17);

      window.__timelines["film"] = tl;
    })();
  </script>
